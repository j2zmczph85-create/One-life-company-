<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="ONE LIFE"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/icon-192.png"><title>ONE LIFE COMPANY</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f5f2;color:#171717}.app{max-width:600px;margin:auto;background:#fff;min-height:100vh}.top{background:#111;color:#fff;padding:16px;position:sticky;top:0;z-index:5}.brand{font-weight:900;color:#e9ad25;letter-spacing:1px}.sub{font-size:10px;color:#bbb;letter-spacing:3px}.wrap{padding:16px 16px 90px}.search{display:flex;gap:8px}.search input,input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:5px 0 10px}button{border:0;border-radius:10px;padding:11px 14px;cursor:pointer}.gold{background:#e9ad25;font-weight:800}.dark{background:#111;color:#fff}.hero{background:#111;color:#fff;padding:20px;border-radius:18px;margin:15px 0}.hero h1{margin:0 0 5px}.cats{display:flex;gap:8px;overflow:auto}.cat{white-space:nowrap;background:#fff;border:1px solid #ddd}.cat.on{background:#111;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid #e5e5e5;border-radius:14px;padding:11px}.pic{width:100%;aspect-ratio:1;object-fit:cover;border-radius:11px;background:#eee}.price{font-weight:900;margin-top:5px}.muted{font-size:12px;color:#777}.add{width:100%;margin-top:8px;background:#111;color:#fff}.page{display:none}.page.on{display:block}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px}.bottom button{background:transparent;color:#666;font-size:12px}.bottom .active{color:#111;font-weight:900}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.adminbox{background:#111;color:#fff;border-radius:15px;padding:15px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#fff;color:#111;padding:10px;border-radius:10px}.stat b{display:block;font-size:18px}.toast{display:none;position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 15px;border-radius:10px;z-index:20}
</style></head><body><div class="app">
<div class="top"><div class="brand">① ONE LIFE</div><div class="sub">COMPANY</div></div>
<div class="wrap">
<section id="shop" class="page on"><div class="search"><input id="q" placeholder="Search products..." oninput="loadProducts()"><button class="gold" onclick="page('cart')">🛒 <span id="count">0</span></button></div>
<div class="hero"><h1>One Life. One Choice.</h1><p>Shop quality products around your university.</p><button class="gold" onclick="document.getElementById('products').scrollIntoView()">SHOP NOW</button></div>
<h3>Categories</h3><div id="cats" class="cats"></div><h3 id="products">Products</h3><div id="grid" class="grid"></div></section>
<section id="cart" class="page"><h2>My Cart</h2><div id="cartBox"></div></section>
<section id="orders" class="page"><h2>My Orders</h2><div id="ordersBox"></div></section>
<section id="account" class="page"><h2>Account</h2><div id="accountBox"></div></section>
<section id="checkout" class="page"><h2>Checkout</h2><div class="card"><label>Full name</label><input id="cname"><label>Phone</label><input id="cphone" placeholder="+255..."><label>Delivery location</label><input id="cloc" placeholder="University / hostel / area"><label>Payment</label><select id="pay"><option>Cash on Delivery</option><option>M-Pesa</option><option>Tigo Pesa</option><option>Airtel Money</option></select><button class="dark" style="width:100%" onclick="checkout()">PLACE ORDER</button></div></section>
<section id="login" class="page"><h2>Login</h2><div class="card"><input id="loginId" placeholder="Phone or email"><input id="loginPw" type="password" placeholder="Password"><button class="dark" onclick="login()">LOGIN</button><button onclick="register()">Create account</button></div></section>
<section id="admin" class="page"><h2>Admin</h2><div id="adminBox"></div></section>
</div>
<div class="bottom"><button id="bshop" class="active" onclick="page('shop')">⌂<br>Shop</button><button id="bcart" onclick="page('cart')">🛒<br>Cart</button><button id="borders" onclick="page('orders')">📦<br>Orders</button><button id="baccount" onclick="page('account')">👤<br>Account</button></div>
<div id="toast" class="toast"></div></div>
<script>
let products=[],cats=[],category="All",cart=JSON.parse(localStorage.cart||"[]"),token=localStorage.token||"",me=null;
const money=n=>"TSh "+Number(n).toLocaleString();
async function api(url,opt={}){opt.headers={...(opt.headers||{}),"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})};let r=await fetch(url,opt),d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",1800)}
function page(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on");document.querySelectorAll(".bottom button").forEach(x=>x.classList.remove("active"));let b=document.getElementById("b"+id);if(b)b.classList.add("active");if(id==="cart")renderCart();if(id==="orders")loadOrders();if(id==="account")loadAccount();if(id==="admin")loadAdmin();scrollTo(0,0)}
async function loadProducts(){try{let q=document.getElementById("q").value;products=await api("/api/products?q="+encodeURIComponent(q)+(category!=="All"?"&category="+encodeURIComponent(category):""));cats=await api("/api/categories");document.getElementById("cats").innerHTML=["All",...cats].map(c=>`<button class="cat ${c===category?"on":""}" onclick="category='${c}';loadProducts()">${c}</button>`).join("");document.getElementById("grid").innerHTML=products.map(p=>`<div class="card"><img class="pic" src="${p.image}" onerror="this.src='https://placehold.co/600?text=ONE+LIFE'"><b>${p.name}</b><div class="muted">${p.category} · ${p.stock} in stock</div><div class="price">${money(p.price)}</div><button class="add" onclick="add(${p.id})">ADD TO CART</button></div>`).join("")||"<p>No products found.</p>";document.getElementById("count").textContent=cart.reduce((a,x)=>a+x.quantity,0)}catch(e){toast(e.message)}}
function add(id){let x=cart.find(x=>x.product_id===id);if(x)x.quantity++;else cart.push({product_id:id,quantity:1});localStorage.cart=JSON.stringify(cart);document.getElementById("count").textContent=cart.reduce((a,x)=>a+x.quantity,0);toast("Added to cart")}
async function renderCart(){if(!cart.length){document.getElementById("cartBox").innerHTML="<p>Your cart is empty.</p>";return}let ps=await Promise.all(cart.map(x=>api("/api/products").then(a=>a.find(p=>p.id===x.product_id))));let total=0;document.getElementById("cartBox").innerHTML=ps.map((p,i)=>{let x=cart[i],sub=p.price*x.quantity;total+=sub;return `<div class="card"><div class="row"><b>${p.name}</b><span>${money(sub)}</span></div><div class="row"><span>${money(p.price)} × ${x.quantity}</span><span><button onclick="qty(${p.id},-1)">−</button><button onclick="qty(${p.id},1)">+</button></span></div></div>`}).join("")+`<div class="card"><div class="row"><b>Total</b><b>${money(total)}</b></div><button class="dark" style="width:100%;margin-top:10px" onclick="page('checkout')">CHECKOUT</button></div>`}
function qty(id,d){let x=cart.find(x=>x.product_id===id);x.quantity+=d;if(x.quantity<1)cart=cart.filter(x=>x.product_id!==id);localStorage.cart=JSON.stringify(cart);renderCart();loadProducts()}
async function checkout(){if(!cart.length)return toast("Cart is empty");if(!me)return page("login");try{let o=await api("/api/orders",{method:"POST",body:JSON.stringify({name:document.getElementById("cname").value,phone:document.getElementById("cphone").value,location:document.getElementById("cloc").value,payment_method:document.getElementById("pay").value,user_id:me.id,items:cart})});cart=[];localStorage.cart="[]";toast("Order "+o.order_code+" placed");page("orders");}catch(e){toast(e.message)}}
async function loadOrders(){if(!token){document.getElementById("ordersBox").innerHTML='<p>Please <button onclick="page("login")">login</button>.</p>';return}try{let os=await api("/api/orders");document.getElementById("ordersBox").innerHTML=os.length?os.map(o=>`<div class="card"><div class="row"><b>#${o.order_code}</b><b>${o.status}</b></div><div>${money(o.total)} · ${o.payment_method}</div><div class="muted">${o.location}<br>${new Date(o.created_at).toLocaleString()}</div></div>`).join(""):"<p>No orders yet.</p>"}catch(e){toast(e.message)}}
async function loadAccount(){let b=document.getElementById("accountBox");if(!token){b.innerHTML='<button class="dark" onclick="page("login")">LOGIN / REGISTER</button>';return}try{me=await api("/api/me");b.innerHTML=`<div class="card"><b>${me.name}</b><p>${me.phone||""}<br>${me.email||""}</p></div>${me.role==="admin"?'<button class="dark" onclick="page("admin")">ADMIN DASHBOARD</button>':""}<button onclick="localStorage.clear();location.reload()">LOG OUT</button>`}catch{localStorage.clear();location.reload()}}
async function login(){try{let d=await api("/api/auth/login",{method:"POST",body:JSON.stringify({login:document.getElementById("loginId").value,password:document.getElementById("loginPw").value})});token=d.token;me=d.user;localStorage.token=token;toast("Welcome "+me.name);page("account")}catch(e){toast(e.message)}}
async function register(){let n=prompt("Your full name"),p=prompt("Phone (+255...)"),pw=prompt("Create password (6+ characters)");if(!n||!p||!pw)return;try{let d=await api("/api/auth/register",{method:"POST",body:JSON.stringify({name:n,phone:p,password:pw})});token=d.token;me=d.user;localStorage.token=token;toast("Account created");page("account")}catch(e){toast(e.message)}}
async function loadAdmin(){if(!token)return page("login");try{let s=await api("/api/admin/stats");let ps=await api("/api/products");let os=await api("/api/orders");document.getElementById("adminBox").innerHTML=`<div class="adminbox"><div class="stats"><div class="stat">Sales<b>${money(s.sales)}</b></div><div class="stat">Orders<b>${s.orders}</b></div><div class="stat">Customers<b>${s.customers}</b></div><div class="stat">Products<b>${s.products}</b></div></div></div><div class="card"><h3>Add product</h3><input id="pn" placeholder="Name"><input id="pp" type="number" placeholder="Price"><input id="pc" placeholder="Category"><input id="pi" placeholder="Image URL"><input id="pst" type="number" placeholder="Stock"><textarea id="pd" placeholder="Description"></textarea><button class="dark" onclick="addProduct()">ADD PRODUCT</button></div><h3>Orders</h3>${os.map(o=>`<div class="card"><div class="row"><b>#${o.order_code}</b><select onchange="status(${o.id},this.value)"><option ${o.status==="New"?"selected":""}>New</option><option ${o.status==="Processing"?"selected":""}>Processing</option><option ${o.status==="Shipped"?"selected":""}>Shipped</option><option ${o.status==="Delivered"?"selected":""}>Delivered</option><option ${o.status==="Cancelled"?"selected":""}>Cancelled</option></select></div><div>${o.customer_name} · ${o.phone}<br>${money(o.total)} · ${o.location}</div></div>`).join("")}`}catch(e){toast(e.message)}}
async function addProduct(){try{await api("/api/products",{method:"POST",body:JSON.stringify({name:pn.value,price:+pp.value,category:pc.value,image:pi.value,stock:+pst.value,description:pd.value})});toast("Product added");loadAdmin();loadProducts()}catch(e){toast(e.message)}}
async function status(id,s){try{await api("/api/orders/"+id+"/status",{method:"PATCH",body:JSON.stringify({status:s})});toast("Order updated")}catch(e){toast(e.message)}}
loadProducts();
</script><script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/sw.js").catch(console.error); }</script></body></html>
